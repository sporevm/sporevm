[tools]
aws-cli = "2.36.7"
gh = "2.89.0"
svu = "3.4.1"
zig = "0.16.0"

[tasks.build]
run = "zig build"
description = "Build sporevm (Debug; use build:release for shipped settings)"

[tasks."build:release"]
run = "zig build --release=safe"
description = "Build sporevm with the shipped ReleaseSafe settings"

[tasks.install]
run = "zig build --release=safe --prefix \"$HOME\""
description = "Install optimized spore into ~/bin"

[tasks.test]
run = "zig build test && scripts/test/contracts.sh"
description = "Run unit tests and benchmark parser contract checks"

[tasks."test:rootfs-slow"]
run = "zig build rootfs-slow-test"
description = "Run slow rootfs/ext4 conformance tests"

[tasks."test:spore-build-conformance"]
run = "mise run build && scripts/spore-build-conformance.py --spore-bin zig-out/bin/spore"
description = "Compare the landed spore build subset with BuildKit on small fixtures"

[tasks."test:image-worker-conformance"]
run = "mise run build:release && scripts/image-worker-conformance.py check --spore-bin zig-out/bin/spore --expected test/image/worker-conformance"
description = "Verify native image conversion output against the cross-worker fixture"

[tasks.check]
run = "mise run test && mise run build && scripts/test/version.sh zig-out && git diff --check"
description = "Run unit tests, build, and diff hygiene"

[tasks.release]
depends = ["check"]
run = "scripts/release/tag.sh"
description = "Tag the next version and push to trigger a Buildkite release"

[tasks."release:prepare"]
run = "scripts/release/prepare.sh"
description = "Update source and package versions for a release"

[tasks."release:snapshot"]
run = "scripts/release/build-assets.sh"
description = "Build local release archives without publishing"

[tasks."smoke:x86"]
run = "mise run build:release && zig build x86-board-smoke --release=safe && test/smoke/x86/run.sh"
description = "Smoke native x86 frozen-board, fresh-product, OCI/rootfs/commit, network-policy, and fail-closed behavior"

[tasks."smoke:x86-build"]
run = "mise run build:release && bash test/smoke/x86/build.sh"
description = "Smoke native x86 build conformance and fail-closed checks"

[tasks."benchmark:disk-fork"]
run = "SPOREVM_DISK_FORK_BENCHMARK=1 zig test src/chunk_mapped_disk.zig -O ReleaseFast -lc --test-filter 'disk fork benchmark'"
description = "Benchmark native disk-head cloning, 32-child preparation, and generation-32 reads"

[tasks.smoke]
run = "mise run build && test/smoke/suite.sh"
description = "Build, then run the aarch64 VM smoke suite: core (per-commit CI gate) or full"

[tasks.benchmark]
run = "mise run build:release && scripts/benchmark/suite.py"
description = "Run the benchmark suite against a ReleaseSafe build"
